name: Validate doctor installers

on:
  push:
    paths:
      - "packaging/**"
      - "requirements-doctor.txt"
      - "scripts/build_doctor_package.sh"
      - "scripts/prepare_doctor_models.py"
      - ".github/workflows/doctor_installers.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "requirements-doctor.txt"
      - "scripts/build_doctor_package.sh"
      - "scripts/prepare_doctor_models.py"
      - ".github/workflows/doctor_installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer package
        run: bash scripts/build_doctor_package.sh 0.1.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-smoke-package
          path: build/doctor-package
  managed-runtime:
    name: Install and upgrade private runtime (without model download)
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QUPATH_USER_DIR: ${{ github.workspace }}/.install-smoke
      TIMESTAMP_SKIP_MODEL_DOWNLOAD: '1'
      TIMESTAMP_SKIP_AUDIO_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: doctor-smoke-package
          path: build/doctor-package
      - name: Install and upgrade on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package=build/doctor-package/TimeStamp-Doctor-0.1.0-ci
          if [[ "$RUNNER_OS" == "macOS" ]]; then installer="$package/Install TimeStamp.command"; else installer="$package/Install TimeStamp on Linux.sh"; fi
          bash "$installer"
          bash "$installer"
          "$QUPATH_USER_DIR/timestamp/runtime/.venv/bin/python" "$package/live_whisper_demo.py" --list-devices
          test -f "$QUPATH_USER_DIR/extensions/TimeStamp-0.1.0-ci.jar"
          test -n "$(find "$QUPATH_USER_DIR/timestamp/extension-backups" -name '*.jar' -print -quit)"
      - name: Install and upgrade on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = 'build/doctor-package/TimeStamp-Doctor-0.1.0-ci'
          & "$package/Install-TimeStamp.ps1"
          & "$package/Install-TimeStamp.ps1"
          & "$env:QUPATH_USER_DIR/timestamp/runtime/.venv/Scripts/python.exe" "$package/live_whisper_demo.py" --list-devices
          if ($LASTEXITCODE -ne 0) { throw 'Runtime device enumeration failed' }
          if (-not (Test-Path "$env:QUPATH_USER_DIR/extensions/TimeStamp-0.1.0-ci.jar")) { throw 'JAR missing' }
          if (-not (Get-ChildItem "$env:QUPATH_USER_DIR/timestamp/extension-backups" -Recurse -Filter '*.jar')) { throw 'Upgrade backup missing' }
  unix-installers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS and Linux shell syntax
        run: |
          bash -n "packaging/macos/Install TimeStamp.command"
          bash -n "packaging/linux/Install TimeStamp.sh"
          bash -n scripts/build_doctor_package.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "packaging/windows/Install-TimeStamp.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
