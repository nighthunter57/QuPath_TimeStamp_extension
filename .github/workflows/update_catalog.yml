name: Update QuPath extension catalog

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          gh release view "$TAG" \
            --json assets \
            --jq '.assets[].name' |
            grep -Fx "TimeStamp-${VERSION}.jar"

      - name: Add release to catalog
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/update_catalog.mjs "$TAG" "$REPOSITORY"

      - name: Commit catalog update
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog already contains ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Add TimeStamp ${TAG} to extension catalog"
          git push
