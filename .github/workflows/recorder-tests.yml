name: Recorder regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-doctor.txt
      - name: Install recorder dependencies
        run: python -m pip install -r requirements-doctor.txt
      - name: Exercise capture, control, recovery metadata and scoring
        run: python -m unittest discover -s scripts/tests
