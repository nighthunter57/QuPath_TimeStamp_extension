name: Recorder regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-doctor.txt
      - name: Install recorder dependencies
        run: python -m pip install -r requirements-doctor.txt
      - name: Exercise capture, control, recovery metadata and scoring
        shell: bash
        run: |
          set -o pipefail
          # Fail on implicit text encodings: Windows defaults to cp1252, not UTF-8.
          python -X warn_default_encoding -W error::EncodingWarning \
            -m unittest discover -s scripts/tests 2>&1 | tee unittest.log
      # Step logs need a signed-in viewer; annotations are readable by anyone.
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import re
          import sys
          sys.stdout.reconfigure(encoding="utf-8")
          log = open("unittest.log", encoding="utf-8", errors="replace").read()
          for block in re.split(r"^={50,}$", log, flags=re.M)[1:]:
              block = block.split("-" * 70 + "\nRan ")[0].strip()
              text = block[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={block.splitlines()[0][:120]}::{text}")
          EOF
